name: Tests

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Lua
      uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.1"

    - name: Setup LuaRocks
      uses: leafo/gh-actions-luarocks@v4

    - name: Cache LuaRocks modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.luarocks
          lua_modules
        key: ${{ runner.os }}-luarocks-${{ hashFiles('lua-game-pilot-dev-1.rockspec') }}
        restore-keys: |
          ${{ runner.os }}-luarocks-

    - name: Setup LuaRocks paths
      run: |
        eval $(luarocks path)
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        luarocks install --tree lua_modules --only-deps lua-game-pilot-dev-1.rockspec

    - name: Setup module paths for tests
      run: |
        eval $(luarocks path --tree lua_modules)
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV
        echo "$(pwd)/lua_modules/bin" >> $GITHUB_PATH

    - name: Run tests
      run: |
        ./lua_modules/bin/busted --verbose --coverage

    - name: Generate coverage report
      run: |
        ./lua_modules/bin/luacov
        cat luacov.report.out

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          luacov.report.out
          luacov.stats.out

    - name: Check coverage threshold
      run: |
        # Extract coverage percentage
        COVERAGE=$(grep -oP 'Total\s+\d+\s+\d+\s+\K[\d.]+' luacov.report.out || echo "0")
        echo "Coverage: ${COVERAGE}%"

        # Check if coverage meets minimum threshold (40%)
        if [ "$(echo "$COVERAGE < 40" | bc)" -eq 1 ]; then
          echo "::warning::Coverage ${COVERAGE}% is below minimum threshold of 40%"
        fi

        # Aspirational target check (80%)
        if [ "$(echo "$COVERAGE < 80" | bc)" -eq 1 ]; then
          echo "::notice::Coverage ${COVERAGE}% is below target of 80%"
        fi
