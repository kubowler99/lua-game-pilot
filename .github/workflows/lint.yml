name: Lint

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Lua
      uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.1"

    - name: Setup LuaRocks
      uses: leafo/gh-actions-luarocks@v4

    - name: Cache LuaRocks modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.luarocks
          lua_modules
        key: ${{ runner.os }}-luarocks-lint-${{ hashFiles('lua-game-pilot-dev-1.rockspec') }}
        restore-keys: |
          ${{ runner.os }}-luarocks-lint-

    - name: Setup LuaRocks paths
      run: |
        eval $(luarocks path)
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: Install luacheck
      run: |
        luarocks install --tree lua_modules luacheck

    - name: Setup module paths
      run: |
        eval $(luarocks path --tree lua_modules)
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV
        echo "$HOME/.luarocks/bin:$(pwd)/lua_modules/bin" >> $GITHUB_PATH

    - name: Run luacheck
      run: |
        ./lua_modules/bin/luacheck Libs Plugins Assets main.lua config.lua

    - name: Validate rockspec
      run: |
        luarocks lint lua-game-pilot-dev-1.rockspec

    - name: Check for debug statements
      run: |
        echo "Checking for debug statements..."
        # Check for print() calls (excluding test files)
        if grep -r "print(" --include="*.lua" --exclude-dir="spec" --exclude-dir="Debug" Libs Plugins Assets main.lua config.lua 2>/dev/null; then
          echo "::warning::Found print() debug statements in code"
        fi

        # Check for TODO/FIXME comments
        if grep -r "TODO:\|FIXME:" --include="*.lua" Libs Plugins Assets main.lua config.lua 2>/dev/null; then
          echo "::notice::Found TODO/FIXME comments in code"
        fi
